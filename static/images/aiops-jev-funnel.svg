<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="ajfTitle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif">
  <title id="ajfTitle">관측성 신호의 단계별 처리 흐름: 로그·메트릭·트레이스가 1차 Rule 필터, 2차 Jev 라우팅, 3차 AI 조치를 거치며 점점 줄어들고, 마지막에 선조치 후 알람·조치 가이드·즉시 호출로 담당자에게 전달된다. 아래로 갈수록 신호 양은 줄고 판단의 깊이는 깊어진다.</title>
  <defs>
    <marker id="ahAjf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="876" height="456" rx="14" fill="#f8f9fb" stroke="#e6e8eb"/>

  <g fill="none" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ahAjf)">
    <path d="M170 52 V76"/>
    <path d="M300 52 V76"/>
    <path d="M430 52 V76"/>
    <path d="M300 372 V386 H160 V400"/>
    <path d="M300 372 V400"/>
    <path d="M300 372 V386 H440 V400"/>
    <path d="M852 84 V362"/>
  </g>

  <g fill="none" stroke="#c4c8cc" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M536 125 H588"/>
    <path d="M470 225 H588"/>
    <path d="M404 325 H588"/>
  </g>

  <g font-size="14" font-weight="500" fill="#1e1e1e" text-anchor="middle">
    <rect x="110" y="20" width="120" height="32" rx="16" fill="#EDEEF0" stroke="#B3B3B3"/>
    <text x="170" y="41">로그</text>
    <rect x="240" y="20" width="120" height="32" rx="16" fill="#EDEEF0" stroke="#B3B3B3"/>
    <text x="300" y="41">메트릭</text>
    <rect x="370" y="20" width="120" height="32" rx="16" fill="#EDEEF0" stroke="#B3B3B3"/>
    <text x="430" y="41">트레이스</text>

    <polygon points="40,80 560,80 500,170 100,170" fill="#CDF4D3" stroke="#66D575" stroke-linejoin="round"/>
    <text x="300" y="120">1차 · Rule 필터</text>
    <polygon points="107,180 493,180 433,270 167,270" fill="#DCCCFF" stroke="#874FFF" stroke-linejoin="round"/>
    <text x="300" y="220">2차 · Jev 라우팅</text>
    <polygon points="173,280 427,280 367,370 233,370" fill="#C2E5FF" stroke="#3DADFF" stroke-linejoin="round"/>
    <text x="300" y="320">3차 · AI 조치</text>

    <rect x="100" y="402" width="120" height="36" rx="9" fill="#EDEEF0" stroke="#B3B3B3"/>
    <text x="160" y="425">선조치 후 알람</text>
    <rect x="240" y="402" width="120" height="36" rx="9" fill="#C2E5FF" stroke="#3DADFF"/>
    <text x="300" y="425">조치 가이드</text>
    <rect x="380" y="402" width="120" height="36" rx="9" fill="#FFCDC2" stroke="#FF7556"/>
    <text x="440" y="425">즉시 호출</text>
  </g>

  <g font-size="11.5" fill="#5f6368" text-anchor="middle">
    <text x="300" y="142">OTel 필터 · Prometheus 규칙 · Alertmanager</text>
    <text x="300" y="242">유형 · 심각도 · 신뢰도</text>
    <text x="300" y="342">런북 실행 · LLM 원인 분석 · 호출</text>
  </g>

  <g font-size="13.5" font-weight="600" fill="#1e1e1e">
    <text x="598" y="112">결정적 규칙</text>
    <text x="598" y="212">빠른 판단</text>
    <text x="598" y="312">조치와 분석</text>
  </g>
  <g font-size="11.5" fill="#5f6368">
    <text x="598" y="132">노이즈 · 중복 · 순간 튐 제거</text>
    <text x="598" y="149">가장 많은 신호를 가장 싸게</text>
    <text x="598" y="232">Choice·Score·Noul 타입 답변</text>
    <text x="598" y="249">애매하면 사람에게 넘김</text>
    <text x="598" y="332">검증된 런북만 자동 실행</text>
    <text x="598" y="349">걸러진 장애에만 LLM 호출</text>
  </g>

  <text x="836" y="223" font-size="11.5" fill="#5f6368" text-anchor="middle" transform="rotate(-90 836 223)">아래로 갈수록 신호는 적게, 판단은 깊게</text>
</svg>
