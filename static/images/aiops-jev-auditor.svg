<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-labelledby="ajaudTitle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif">
  <title id="ajaudTitle">주기 점검 에이전트 루프: 매니페스트·스캔 리포트·사용량을 수집하고, LLM이 보안·가용성·확장성·성능 관점에서 분석하고, Jev가 영향·난이도·위험으로 우선순위를 매긴 뒤, 제안 리포트와 GitOps PR을 만든다. 사람이 리뷰하고 머지한 결과는 다음 주기 수집에 반영된다.</title>
