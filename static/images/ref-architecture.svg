<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="refTitle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif">
  <title id="refTitle">통합 참조 아키텍처: 추상 목표를 받은 메타-오케스트레이터(계층 0)가 명세화(1)·팀 합성(2)·구축 검증(3)·배포 운영(4)·자기개선(5) 계층을 생성하고, 계층 2는 ChatDev/MetaGPT SWE 팀을 인스턴스화하며, 계층 4의 운영 텔레메트리가 적합도 신호로 계층 5에 환류되어 계층 0으로 루프가 닫힌다</title>
  <defs>
    <marker id="ahRef" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9aa0a6"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="916" height="356" rx="14" fill="#f8f9fb" stroke="#e6e8eb"/>

  <!-- solid edges: 순방향 파이프라인 -->
  <g fill="none" stroke="#9aa0a6" stroke-width="2" marker-end="url(#ahRef)">
    <path d="M188 55 H345"/>
    <path d="M218 189 H252"/>
    <path d="M452 189 H486"/>
    <path d="M664 189 H698"/>
    <path d="M793 218 V270"/>
  </g>
  <!-- dashed edges: 생성 · 인스턴스화 · 재합성(환류) -->
