<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="ajrTitle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif">
  <title id="ajrTitle">선조치 후 알람 흐름: 1차 Rule 필터를 통과한 로그·트레이스·메트릭 신호, Jev 분류, 가드레일(허용 목록·횟수 제한·승격 단계) 검사, 런북 실행, 결과 검증 순으로 진행한다. 가드레일을 통과하지 못하면 AI 조치 가이드로 전환하고, 검증에 실패하면 역동작 실행 후 즉시 호출, 성공하면 조치 내역과 원인 분석을 알린다.</title>
